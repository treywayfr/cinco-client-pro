name: Build Star Client

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Set up Gradle 9.2.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.2.1"
      - name: Build Star Client
        run: gradle build --no-daemon
      - name: Upload Star Client JAR
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: star-client-3.0.6-mc1.21.11-AA-ROUNDING-SILENT-HUD
          path: build/libs/star-client-3.0.6.jar
          if-no-files-found: error
